<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE978">
<title>Envíos Logistics</title>
<style>
  :root { --fondo:#FFE978; --perfil:#FFD600; --azul:#2979FF; --texto:#333; --gris:#666; --linea:#F0F0F0; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { font-family:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background:#e9e9e9; color:var(--texto); }
  .app { max-width:480px; height:100%; margin:0 auto; display:flex; flex-direction:column; background:#fff; padding-top:env(safe-area-inset-top,0px); }
  .pages { flex:1; position:relative; overflow:hidden; }
  .page { position:absolute; inset:0; display:none; overflow-y:auto; }
  .page.on { display:flex; flex-direction:column; }

  /* Ruta */
  .ruta { background:var(--fondo); align-items:center; justify-content:center; padding:20px 20px 100px; }
  .ruta .ilus { width:100%; height:auto; max-height:300px; object-fit:contain; margin-bottom:10px; }
  .ruta h1 { font-size:24px; font-weight:600; text-align:center; }
  .ruta p { font-size:17px; margin-top:6px; text-align:center; }
  .btn { position:absolute; left:20px; right:20px; bottom:30px; background:var(--azul); color:#fff; border:0; border-radius:12px; padding:14px; font:bold 16px inherit; font-family:inherit; cursor:pointer; }
  .btn:active { opacity:.85; }

  /* Notificaciones */
  .vacio { align-items:center; justify-content:center; padding:20px; }
  .vacio svg { width:64px; height:64px; stroke:#999; }
  .vacio p { margin-top:15px; font-size:18px; color:var(--gris); text-align:center; }

  /* Más */
  .head { display:flex; align-items:center; gap:15px; padding:40px 25px 25px; background:var(--perfil); }
  .avatar { width:60px; height:60px; border-radius:50%; background:#fff; display:grid; place-items:center; flex:none; }
  .avatar svg { width:34px; height:34px; stroke:#555; }
  .head small { display:block; font-size:13px; color:#444; }
  .head strong { font-size:15px; color:#000; }
  .op { display:flex; align-items:center; gap:15px; width:100%; padding:16px 25px; background:none; border:0; font:15px inherit; font-family:inherit; color:var(--texto); text-align:left; cursor:pointer; }
  .op svg { width:24px; height:24px; stroke:#555; flex:none; }
  .op:active { background:#f7f7f7; }
  hr { border:0; height:1px; background:var(--linea); margin:5px 0; }
  .borrar { display:block; padding:15px 25px 40px; color:#2196F3; font-size:13px; text-decoration:none; }

  /* Barra inferior */
  .bar { display:flex; height:75px; background:#fff; border-top:1px solid #EEE; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:0; font:10px inherit; font-family:inherit; color:#888; cursor:pointer; }
  .tab svg { width:26px; height:26px; stroke:currentColor; }
  .tab[aria-selected="true"] { color:var(--azul); font-weight:600; }
  .tab:focus-visible, .op:focus-visible, .btn:focus-visible { outline:3px solid var(--azul); outline-offset:-3px; }
  svg { fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>

  const paginas = document.querySelectorAll('.page');
  const tabs = document.querySelectorAll('.tab');
  const fondos = ['#FFE978', '#ffffff', '#FFD600'];
  function ir(n) {
    paginas.forEach((p, i) => p.classList.toggle('on', i === n));
    tabs.forEach((t, i) => t.setAttribute('aria-selected', i === n));
    document.body.style.background = '#e9e9e9';
    document.querySelector('meta[name=theme-color]').content = fondos[n];
  }
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => ir(+b.dataset.go)));
